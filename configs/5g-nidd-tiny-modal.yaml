# Modal pipeline test on CPU (costs cents): a tiny random Llama (2 layers, public Muse Glimmer
# tokenizer) on the real shards. Checks the image, the linux horizon-he binary, volumes, per-operator
# isolation, the signing-key secret, parallel operators and the local↔container file exchange.
# Its numbers mean nothing.
model:
  id: /vol/models/tiny_llama   # uploaded by `python -m modal_app.provision tiny`
  revision: main
  dtype: float32
  device: cpu
lora:
  r: 8
  alpha: 16
  target_modules: [q_proj, k_proj, v_proj, o_proj]
train:
  lr: 1.0e-3
  batch_size: 4
  micro_batch: 2
  local_epochs: 0.5       # exercises fractional epochs
  rounds: 3
  seed: 1234
  adapter_seed: 4321
  restrict_missing_labels: true
fl:
  server_lr: 2.0          # exercises the server step
data_dir: data/processed       # replaced inside each container by its own mounted shard / test set
results_dir: runs/5g-nidd-tiny-modal/results  # never results/: these numbers mean nothing
eval:
  batch_flows: 4
  every_round: true
  split: val              # exercises federated validation (operators' own val splits)
modal:
  gpu: null
  cpu: 2
  memory_mb: 4096
  timeout_s: 900
