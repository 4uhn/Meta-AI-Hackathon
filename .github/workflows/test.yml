name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: crypto/go.mod
          cache-dependency-path: crypto/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python environment (CPU-only torch)
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --upgrade pip
          .venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -q -e '.[train,modal,dev]'

      - name: Build the crypto CLI
        run: make he

      - name: Go and Python tests
        run: make test

      - name: Examples
        run: .venv/bin/python examples/secure-aggregation/secure_sum.py --parties 5 --threshold 4 --size 200000
