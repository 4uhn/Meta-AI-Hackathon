[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon"
version = "0.1.0"
description = "Federated LoRA fine-tuning of LLMs with threshold-encrypted (t-of-N CKKS) aggregation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Chau" }]
# Core: enough to drive the threshold-encryption layer (horizon.he_bridge) from Python.
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/4uhn/Meta-AI-Hackathon"

[project.optional-dependencies]
# Federated fine-tuning, evaluation and reports (minimums = the versions the results were produced with).
train = [
  "torch>=2.14",
  "transformers>=5.21",
  "peft>=0.21",
  "safetensors>=0.8",
  "pandas>=2.2",
  "matplotlib>=3.8",
]
modal = ["modal==1.6.3"]  # GPU runs on your own Modal account
dev = ["pytest>=8", "ruff>=0.6", "black>=24"]

[tool.setuptools.packages.find]
include = ["horizon*"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: end-to-end runs with the tiny model, a few minutes on CPU (run with -m slow)",
]
addopts = "-m 'not slow'"
